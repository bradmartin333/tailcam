# Tailnet-only: anyone on the tailnet can watch at http://<tailnet-ip>:8555/.
# For the public, token-gated deployment see the README ("Publicly, behind a
# token link"); it lives in the homelab repo, not here.
services:
  tailcam:
    image: bradmartin333/tailcam:latest
    container_name: tailcam
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    device_cgroup_rules:
      - "c 81:* rmw"   # video4linux
      - "c 116:* rmw"  # ALSA
    volumes:
      - /dev:/dev:ro
    environment:
      # Only answer requests addressed to the tailnet IP (blocks DNS rebinding). Add any other name you
      # browse to, comma-separated, e.g. "${TAILSCALE_IP}:8555,box.tail1234.ts.net:8555".
      TAILCAM_HOSTS: "${TAILSCALE_IP}:8555"
    ports:
      - "${TAILSCALE_IP:?set TAILSCALE_IP to the box's tailnet IP (tailscale ip -4)}:8555:8080"
