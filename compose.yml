services:
  tailcam:
    image: bradmartin333/tailcam:latest
    container_name: tailcam
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    device_cgroup_rules:
      - "c 81:* rmw"
    volumes:
      - /dev:/dev:ro
    ports:
      - "${TAILSCALE_IP:?set TAILSCALE_IP in the root .env}:8555:8080"